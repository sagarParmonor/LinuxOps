
---
- name: Validate LinuxOps project
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:
    - name: Check that project scripts exist
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - "{{ playbook_dir }}/../scripts/health_check.sh"
        - "{{ playbook_dir }}/../scripts/log_analyzer.sh"
        - "{{ playbook_dir }}/../scripts/run_all.sh"
      register: script_results

    - name: Fail if any script is missing
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.isreg
        fail_msg: "A required LinuxOps script is missing: {{ item.item }}"
        success_msg: "Script exists: {{ item.item }}"
      loop: "{{ script_results.results }}"

    - name: Ensure scripts are executable
      ansible.builtin.file:
        path: "{{ item }}"
        mode: "0755"
      loop:
        - "{{ playbook_dir }}/../scripts/health_check.sh"
        - "{{ playbook_dir }}/../scripts/log_analyzer.sh"
        - "{{ playbook_dir }}/../scripts/run_all.sh"
